spring.application.name=EventManager
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://dpg-d3l453juibrs73ccolf0-a.frankfurt-postgres.render.com/event_manager_postgres?sslmode=require
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.session.store-type=none

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.base64=${JWT_SECRET_BASE64:false}

#show errors for debugging
server.error.include-message=always

spring.thymeleaf.check-template-location=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


